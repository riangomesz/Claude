<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#C3CCEE">
  <title>Instagram Intelligence — Inteligência Audiovisual</title>
  <!-- Sem flash: resolve o tema antes do primeiro paint. Preferência em localStorage "ii-theme" = light | dark | system. -->
  <script>
    (function () {
      var pref = "system";
      try { var v = localStorage.getItem("ii-theme"); if (v === "light" || v === "dark" || v === "system") pref = v; } catch (e) {}
      var dark = pref === "dark" || (pref === "system" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
      var root = document.documentElement;
      root.setAttribute("data-theme", dark ? "dark" : "light");
      root.setAttribute("data-theme-pref", pref);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", dark ? "#0B111C" : "#C3CCEE");
    })();
  </script>
  <link rel="stylesheet" href="THEME_TOKENS.css">
  <link rel="stylesheet" href="styles/components.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div id="app" class="app">
    <noscript><p style="padding:24px">Esta interface precisa de JavaScript habilitado.</p></noscript>
  </div>
  <div id="toasts" class="toast-region" role="status" aria-live="polite"></div>
  <div id="layer"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
